slug: circuit-analysis
title: Circuit Analysis & Simulation
leads:
  - Jens Koch
summary: Circuit-Hamiltonian analysis and simulation of superconducting qubits with scqubits.
entrypoints:
  - path: notebooks/circuit_analysis.ipynb
    kind: notebook
    description: scqubits walkthrough — qubit GUI, Transmon spectra and matrix elements, and transmon–oscillator coupling via HilbertSpace.
notebooks:
  - notebooks/circuit_analysis.ipynb
assets:
python_dependencies:
  - jupyter
  - scqubits
system_dependencies:
smoke_commands:
  - test -f notebooks/circuit_analysis.ipynb
  - python -c "import importlib.util; assert importlib.util.find_spec('scqubits') is not None"
execution_targets:
  - path: notebooks/circuit_analysis.ipynb
    kind: notebook
    timeout_seconds: 1200
