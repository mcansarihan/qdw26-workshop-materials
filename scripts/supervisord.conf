; Supervisor config for the attendee workshop container.
;
; Runs four long-lived services as the unconfined `ubuntu` user (no privilege
; escalation needed):
;   - Xtigervnc : a headless X server on display :1  (VNC on 127.0.0.1:5901)
;   - fluxbox   : a minimal window manager on :1
;   - novnc     : websockify bridge serving the noVNC web client on :6080
;   - jupyter   : JupyterLab on :8888 (kernel forced headless/offscreen)
;
; The Palace runner service is started separately by container-entrypoint.sh so
; it is available to every container command (dev, CI, deploy), not just here.

[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:xvnc]
command=/usr/bin/Xtigervnc :1 -geometry %(ENV_QDW_VNC_GEOMETRY)s -depth 24 -rfbport 5901 -localhost -SecurityTypes None -AlwaysShared
autorestart=true
priority=10
stopsignal=TERM
stdout_logfile=/tmp/xvnc.log
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/ubuntu"

[program:fluxbox]
command=/home/ubuntu/qdw-workshop-materials/scripts/desktop/start-desktop.sh
autorestart=true
priority=20
startsecs=2
stdout_logfile=/tmp/fluxbox.log
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=HOME="/home/ubuntu",DISPLAY=":1"

[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc 6080 localhost:5901
autorestart=true
priority=30
startsecs=2
stdout_logfile=/tmp/novnc.log
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:jupyter]
command=/home/ubuntu/qdw-workshop-materials/scripts/start-jupyter.sh
directory=/home/ubuntu/qdw-workshop-materials
autorestart=true
priority=40
startsecs=5
stdout_logfile=/tmp/jupyter.log
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:codeserver]
command=/usr/bin/code-server --bind-addr 0.0.0.0:8080 --auth none --disable-telemetry --disable-update-check /home/ubuntu/qdw-workshop-materials
directory=/home/ubuntu/qdw-workshop-materials
autorestart=true
priority=45
startsecs=5
; Headless kernels (same as JupyterLab); no DISPLAY so notebooks render inline.
environment=HOME="/home/ubuntu",SHELL="/bin/bash",QISKIT_METAL_HEADLESS="1",QT_QPA_PLATFORM="offscreen",MPLBACKEND="Agg"
stdout_logfile=/tmp/codeserver.log
stdout_logfile_maxbytes=0
redirect_stderr=true
