services:
  dev:
    # NOTE: this file is consumed directly by Brev's launchable validator, which
    # does NOT support docker-compose variable interpolation (it rejects the
    # dollar-brace default syntax in the ports IP field). Keep every value here
    # LITERAL. For local overrides use compose.yaml instead.
    image: ghcr.io/quantum-device-consortium/qdw-workshop-materials:main
    platform: linux/amd64
    working_dir: /home/ubuntu/qdw-workshop-materials
    init: true
    # Bring the workspace back automatically after a Brev pause/resume or a host
    # reboot, so attendees never have to re-run a command.
    restart: unless-stopped
    ports:
      # JupyterLab (Brev proxies this port to the attendee).
      - "8888:8888"
      # code-server — VS Code in the browser.
      - "8080:8080"
      # noVNC web desktop (KLayout / Qiskit Metal GUI in the browser).
      - "6080:6080"
    environment:
      # Headless defaults for notebook kernels. The kernel itself also clears
      # DISPLAY and forces offscreen Qt (see scripts/start-jupyter.sh); these are
      # belt-and-suspenders so any process started in the container is headless
      # by default while the noVNC desktop keeps its own DISPLAY=:1.
      QISKIT_METAL_HEADLESS: "1"
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      # Tokenless JupyterLab by default (access is gated by the Brev proxy).
      # To require a token, set a non-empty value here.
      QDW_JUPYTER_TOKEN: ""
      QDW_VNC_GEOMETRY: "1440x900"
    # Drop only the dangerous default capability behaviour while keeping what
    # OpenMPI / the X server need. no-new-privileges prevents setuid escalation.
    security_opt:
      - no-new-privileges:true
    command: ["/home/ubuntu/qdw-workshop-materials/scripts/start-services.sh"]
